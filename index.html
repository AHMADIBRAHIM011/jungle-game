<script>
/* ===== حزمة التثبيت كتطبيق (PWA) — صقها قبل </body> مباشرة ===== */
(function(){
  /* ١) توليد أيقونة PNG برمجيًا — لا حاجة لملفات صور */
  function makeIcon(size){
    const c=document.createElement('canvas');c.width=c.height=size;
    const x=c.getContext('2d'),r=size*.22,k=size/24;
    const g=x.createLinearGradient(0,0,size,size);
    g.addColorStop(0,'#F7C95B');g.addColorStop(1,'#D9920F');
    x.fillStyle=g;x.beginPath();
    x.moveTo(r,0);x.arcTo(size,0,size,size,r);x.arcTo(size,size,0,size,r);
    x.arcTo(0,size,0,0,r);x.arcTo(0,0,size,0,r);x.closePath();x.fill();
    x.fillStyle='#221703';
    x.translate(size/2,size/2);x.rotate(-Math.PI/4);x.scale(k,k);x.translate(-12,-12);
    x.fill(new Path2D('M17.8 19.2 16 11l3.5-3.5C21 6 21.5 4 21 3c-1-.5-3 0-4.5 1.5L13 8 4.8 6.2c-.5-.1-.9.1-1.1.5l-.3.5c-.2.5-.1 1 .3 1.3L9 12l-2 3H4l-1 1 3 2 2 3 1-1v-3l3-2 3.5 5.3c.3.4.8.5 1.3.3l.5-.2c.4-.3.6-.7.5-1.2z'));
    return c.toDataURL('image/png');
  }
  const i192=makeIcon(192), i512=makeIcon(512);
  const base=new URL('./',location.href).href;

  /* ٢) بناء ملف manifest ديناميكيًا */
  const manifest={name:'وِجهة — دفتر رحلاتك الخاص',short_name:'وِجهة',
    description:'سجّل رحلاتك: التذاكر، الأماكن، الصور، المستلزمات، وعدّاد تنازلي حتى الإقلاع.',
    start_url:base,scope:base,display:'standalone',orientation:'portrait',
    background_color:'#0B0D10',theme_color:'#0B0D10',lang:'ar',dir:'rtl',
    icons:[{src:i192,sizes:'192x192',type:'image/png'},
           {src:i512,sizes:'512x512',type:'image/png'},
           {src:i512,sizes:'512x512',type:'image/png',purpose:'maskable'}]};
  const mf=document.createElement('link');mf.rel='manifest';
  mf.href=URL.createObjectURL(new Blob([JSON.stringify(manifest)],{type:'application/manifest+json'}));
  document.head.appendChild(mf);

  /* ٣) أيقونة المتصفح + إعدادات iOS */
  const add=(tag,attrs)=>{const el=document.createElement(tag);for(const a in attrs)el.setAttribute(a,attrs[a]);document.head.appendChild(el);};
  add('link',{rel:'icon',href:i192});
  add('link',{rel:'apple-touch-icon',href:i192});
  add('meta',{name:'apple-mobile-web-app-capable',content:'yes'});
  add('meta',{name:'mobile-web-app-capable',content:'yes'});
  add('meta',{name:'apple-mobile-web-app-status-bar-style',content:'black-translucent'});
  add('meta',{name:'apple-mobile-web-app-title',content:'وِجهة'});

  /* ٤) زر تثبيت لأندرويد + تلميح للآيفون */
  let deferred=null;
  const installed=matchMedia('(display-mode: standalone)').matches||navigator.standalone;
  const btn=document.createElement('button');
  btn.className='btn primary';
  btn.style.cssText='position:fixed;bottom:18px;inset-inline-start:18px;z-index:150;box-shadow:0 10px 30px rgba(0,0,0,.5);display:none;align-items:center;gap:.5em';
  btn.textContent='⬇️ تثبيت التطبيق';
  btn.onclick=async()=>{if(!deferred)return;deferred.prompt();await deferred.userChoice;deferred=null;btn.style.display='none';};
  document.body.appendChild(btn);

  if(/iphone|ipad|ipod/i.test(navigator.userAgent)&&!installed){
    const tip=document.createElement('div');
    tip.style.cssText='position:fixed;bottom:18px;inset-inline-start:18px;z-index:150;max-width:280px;background:var(--card3);border:1px solid var(--line);border-radius:14px;padding:12px 16px;font-size:.85rem;box-shadow:0 10px 30px rgba(0,0,0,.5)';
    tip.innerHTML='📲 للتثبيت على الآيفون: اضغط زر <b>المشاركة</b> ثم <b>«إضافة إلى الشاشة الرئيسية»</b><button style="position:absolute;top:4px;inset-inline-end:10px;color:var(--muted)" onclick="this.parentNode.remove()">✕</button>';
    document.body.appendChild(tip);
  }
  window.addEventListener('beforeinstallprompt',e=>{e.preventDefault();deferred=e;if(!installed)btn.style.display='inline-flex';});
  window.addEventListener('appinstalled',()=>{btn.style.display='none';toast('ثُبّت التطبيق — تجده في شاشتك الرئيسية');});

  /* ٥) العمل بدون إنترنت: تسجيل Service Worker إن وُجد ملف sw.js */
  if('serviceWorker' in navigator&&(location.protocol==='https:'||location.hostname==='localhost')){
    navigator.serviceWorker.register('sw.js').catch(()=>{});
  }
})();
</script>
