<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#0B0D10">
<title>وِجهة — دفتر رحلاتك</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Alexandria:wght@400;500;600;700;800&family=Readex+Pro:wght@300;400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#0B0D10; --card:#14181E; --card2:#1B212A; --card3:#232B36;
  --ink:#EDEAE2; --ink2:#B9C0C9; --muted:#828C97;
  --acc:#F0B429; --acc-soft:rgba(240,180,41,.12);
  --teal:#3ECFB2; --teal-soft:rgba(62,207,178,.1);
  --danger:#FF7A59;
  --line:rgba(237,234,226,.16); --line2:rgba(237,234,226,.08);
  --sh:0 12px 32px rgba(0,0,0,.4);
}
*{box-sizing:border-box;margin:0}
[hidden]{display:none!important}
html{scroll-behavior:smooth}
body{font-family:'Readex Pro',sans-serif;color:var(--ink);line-height:1.8;min-height:100vh;
  background:var(--bg);
  background-image:
    radial-gradient(1100px 480px at 88% -8%, rgba(240,180,41,.07), transparent 60%),
    radial-gradient(900px 480px at -8% 108%, rgba(62,207,178,.06), transparent 60%),
    radial-gradient(rgba(255,255,255,.035) 1px, transparent 1.4px);
  background-size:auto,auto,26px 26px}
::-webkit-scrollbar{width:10px;height:10px}
::-webkit-scrollbar-track{background:var(--bg)}
::-webkit-scrollbar-thumb{background:#242C37;border-radius:99px;border:2px solid var(--bg)}
::selection{background:var(--acc);color:#221703}
h1,h2,h3,.display{font-family:'Alexandria',sans-serif;font-weight:700;line-height:1.45}
button{font:inherit;color:inherit;cursor:pointer;background:none;border:none}
input,textarea{font:inherit;color:inherit}
a{color:var(--teal)}
img{user-select:none}
.ic{width:1.15em;height:1.15em;stroke:currentColor;fill:none;stroke-width:1.9;stroke-linecap:round;stroke-linejoin:round;vertical-align:-.22em;flex:none}
.wrap{max-width:1000px;margin:auto;padding:0 20px}
.muted{color:var(--muted)}
.grow{flex:1}

/* ===== أزرار ===== */
.btn{display:inline-flex;align-items:center;gap:.55em;padding:.55em 1.2em;border:1.5px solid var(--line);
  border-radius:13px;background:var(--card2);font-weight:600;color:var(--ink);
  box-shadow:0 4px 16px rgba(0,0,0,.28);transition:transform .16s,box-shadow .16s,border-color .16s,filter .16s}
.btn:hover{transform:translateY(-1px);border-color:rgba(240,180,41,.45)}
.btn:active{transform:translateY(1px)}
.btn.primary{background:linear-gradient(135deg,#F7C95B,#E8A62E);color:#221703;border-color:transparent;font-weight:700}
.btn.primary:hover{filter:brightness(1.07);box-shadow:0 6px 22px rgba(240,180,41,.25)}
.btn.danger{background:linear-gradient(135deg,#FF8A68,#F0663F);color:#2A0E05;border-color:transparent;font-weight:700}
.btn.danger:hover{filter:brightness(1.06)}
.btn.ghost{background:transparent;box-shadow:none}
.btn.ghost:hover{background:var(--card2)}
.btn.sm{padding:.3em .9em;font-size:.87em}
.btn.lg{padding:.7em 1.6em;font-size:1.05em;border-radius:15px}
.btn.wide{width:100%;justify-content:center;margin-top:16px}
.iconbtn{display:inline-flex;align-items:center;justify-content:center;width:36px;height:36px;flex:none;
  border:1.5px solid var(--line);border-radius:11px;background:var(--card2);transition:.16s;text-decoration:none;color:var(--ink2)}
.iconbtn:hover{border-color:rgba(240,180,41,.5);color:var(--ink);transform:translateY(-1px)}
.iconbtn.danger:hover{color:var(--danger);border-color:rgba(255,122,89,.55)}

/* ===== الشريط العلوي ===== */
#appbar{position:sticky;top:0;z-index:50;background:rgba(11,13,16,.82);backdrop-filter:blur(14px);
  border-bottom:1px solid var(--line2)}
#appbar .wrap{display:flex;align-items:center;gap:10px;padding-top:10px;padding-bottom:10px}
.brand{display:flex;align-items:center;gap:11px;font-family:'Alexandria';font-weight:800;font-size:1.3rem;color:var(--ink)}
.brand small{font-family:'Readex Pro';font-weight:400;font-size:.7rem;color:var(--muted);margin-top:7px;display:block}
.logo{width:40px;height:40px;border-radius:13px;display:flex;align-items:center;justify-content:center;
  background:linear-gradient(135deg,#F7C95B,#E8A62E);color:#221703;box-shadow:0 4px 18px rgba(240,180,41,.3)}
.logo .ic{width:20px;height:20px;transform:scaleX(-1) rotate(10deg)}
#savedFlag{display:inline-flex;align-items:center;gap:.4em;font-size:.8rem;color:var(--teal);font-weight:600;
  opacity:0;transition:opacity .4s;margin-inline-start:6px}
#savedFlag.on{opacity:1}
#savedFlag .ic{width:.95em;height:.95em}
.ab-actions{margin-inline-start:auto;display:flex;gap:8px;align-items:center}

/* ===== الرئيسية ===== */
.hero{display:grid;grid-template-columns:1.15fr .85fr;gap:26px;align-items:center;padding:46px 0 30px}
.kicker{color:var(--acc);font-weight:600;font-size:.9rem}
.hero h1{font-size:clamp(3.2rem,8vw,5rem);line-height:1.15;margin:2px 0 6px;color:var(--ink)}
.hero h1 i{font-style:normal;color:var(--acc)}
.rule{width:110px;height:2px;background:linear-gradient(90deg,var(--acc),transparent);border-radius:99px;margin:8px 0 14px}
.hero-sub{color:var(--ink2);max-width:48ch;font-weight:300}
.hero-actions{margin-top:22px;display:flex;gap:12px;align-items:center;flex-wrap:wrap}
.stats{margin-top:18px;font-size:.85rem;color:var(--muted)}
.hero-art{display:flex;justify-content:center}
.compass{width:min(320px,70vw);color:var(--ink2)}
.compass text{font-family:'Alexandria';fill:var(--muted)}

.tickets{display:grid;gap:18px;padding-bottom:70px}
.sec-title{display:flex;align-items:center;gap:12px;margin:6px 0 16px}
.sec-title h2{font-size:1.3rem}
.sec-title .rule{margin:0;flex:1;max-width:60px}

.ticket{position:relative;display:flex;background:var(--card);border:1px solid var(--line);
  border-radius:18px;box-shadow:var(--sh);transition:transform .2s,border-color .2s,box-shadow .2s;overflow:hidden}
.ticket:hover{transform:translateY(-3px);border-color:rgba(240,180,41,.35);box-shadow:0 16px 40px rgba(0,0,0,.5)}
.ticket::before,.ticket::after{content:'';position:absolute;width:20px;height:20px;border-radius:50%;
  background:var(--bg);border:1px solid var(--line);left:208px;z-index:2}
.ticket::before{top:-11px}
.ticket::after{bottom:-11px}
.t-main{flex:1;padding:18px 22px;cursor:pointer;min-width:0}
.t-dest{font-family:'Alexandria';font-weight:700;font-size:1.65rem;color:var(--acc);line-height:1.35}
.t-route{display:flex;align-items:center;gap:8px;color:var(--ink2);font-size:.92rem;margin-top:2px}
.t-route .ic{color:var(--teal);transform:scaleX(-1)}
.t-dates{margin-top:8px;font-size:.85rem;color:var(--muted);display:flex;flex-wrap:wrap;gap:4px 14px}
.t-dates .ic{color:var(--muted)}
.t-cut{align-self:stretch;width:0;border-left:2px dashed var(--line);margin:14px 0}
.t-side{width:218px;flex:none;padding:14px 16px;display:flex;flex-direction:column;gap:10px;background:rgba(255,255,255,.015)}
.badge{display:inline-flex;align-items:center;gap:.45em;padding:.12em .8em;border-radius:99px;
  font-size:.78rem;font-weight:700;border:1.5px solid;width:max-content}
.badge.up{color:var(--teal);border-color:rgba(62,207,178,.4);background:var(--teal-soft)}
.badge.run{color:#221703;background:var(--acc);border-color:transparent}
.badge.run i{width:7px;height:7px;border-radius:50%;background:#221703;animation:pulse 1.6s infinite}
.badge.done{color:var(--muted);border-color:var(--line2)}
@keyframes pulse{0%{box-shadow:0 0 0 0 rgba(34,23,3,.45)}100%{box-shadow:0 0 0 7px rgba(34,23,3,0)}}
.mini{font-size:.85rem;color:var(--ink2)}
.mini b{color:var(--acc);font-weight:700;font-variant-numeric:tabular-nums}
.mini.live{color:var(--acc)}
.t-acts{margin-top:auto;display:flex;gap:8px}
@media (max-width:720px){
  .hero{grid-template-columns:1fr;padding-top:28px}
  .hero-art{order:-1}
  .ticket{flex-direction:column}
  .ticket::before,.ticket::after{display:none}
  .t-cut{display:none}
  .t-side{width:auto;border-top:1px dashed var(--line);flex-direction:row;align-items:center;flex-wrap:wrap}
  .t-acts{margin-top:0;margin-inline-start:auto}
}
.empty{background:var(--card);border:1.5px dashed var(--line);border-radius:22px;
  padding:52px 24px;text-align:center;margin-top:10px}
.empty h3{font-size:1.45rem;color:var(--acc)}
.empty p{color:var(--ink2);max-width:46ch;margin:8px auto 22px;font-weight:300}

/* ===== صفحة الرحلة ===== */
.trip-top{display:flex;align-items:center;gap:10px;margin-top:18px;flex-wrap:wrap}
.trip-hero{display:grid;grid-template-columns:290px 1fr;background:var(--card);border:1px solid var(--line);
  border-radius:20px;box-shadow:var(--sh);overflow:hidden;margin-top:14px;position:relative}
.th-cover{border-inline-end:1px solid var(--line2);min-height:250px;position:relative;
  background:linear-gradient(160deg,#10231F,#0D1418);display:flex;align-items:center;justify-content:center}
.th-cover img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.th-cover .ph{color:rgba(237,234,226,.4);text-align:center;font-size:.85rem;display:flex;flex-direction:column;align-items:center;gap:6px}
.th-cover .ph .ic{width:44px;height:44px;stroke-width:1.2;color:var(--teal)}
.cover-btns{position:absolute;bottom:10px;inset-inline-start:10px;display:flex;gap:6px;z-index:3}
.cover-btns .iconbtn{background:rgba(11,13,16,.8);backdrop-filter:blur(6px)}
.stamp{position:absolute;top:14px;inset-inline-start:14px;transform:rotate(-12deg);z-index:3;
  border:2.5px solid var(--acc);color:var(--acc);border-radius:50%;width:92px;height:92px;
  display:flex;flex-direction:column;align-items:center;justify-content:center;
  font-family:'Alexandria';font-weight:700;font-size:.85rem;line-height:1.3;text-align:center;
  background:rgba(11,13,16,.55);backdrop-filter:blur(2px);box-shadow:0 0 24px rgba(240,180,41,.2)}
.th-body{padding:20px 26px 24px;min-width:0}
.th-body h1{font-size:clamp(2rem,5vw,3rem);margin:4px 0 2px;color:var(--ink)}
.route{display:flex;align-items:center;gap:12px;margin:8px 0 4px;max-width:520px}
.rc small{display:block;font-size:.72rem;color:var(--muted);font-weight:600}
.rc b{font-family:'Alexandria';font-size:1.2rem;font-weight:600}
.rl{flex:1;position:relative;height:20px;min-width:70px}
.rl i{position:absolute;inset-inline:0;top:50%;border-top:2px dotted var(--line)}
.rpl{position:absolute;top:50%;left:50%;transform:translate(-50%,-55%) scaleX(-1);
  background:var(--card);padding:0 9px;color:var(--acc)}
.dates-row{display:flex;flex-wrap:wrap;gap:8px;margin-top:12px}
.chip{display:inline-flex;align-items:center;gap:.45em;padding:.2em .85em;border:1.4px solid var(--line);
  border-radius:99px;background:var(--card2);font-size:.82rem;font-weight:500;color:var(--ink2)}
.chip .ic{color:var(--teal)}
.chip b{color:var(--ink);font-weight:600}
.th-notes{margin-top:12px;font-size:.92rem;color:var(--ink2);white-space:pre-wrap;
  border-inline-start:3px solid var(--acc);padding-inline-start:12px}
.th-actions{display:flex;gap:8px;margin-top:16px;flex-wrap:wrap}
@media (max-width:760px){
  .trip-hero{grid-template-columns:1fr}
  .th-cover{min-height:190px;border-inline-end:none;border-bottom:1px solid var(--line2)}
}

/* العدّاد الحي */
.counter{margin:20px 0 0;background:linear-gradient(180deg,#161C24,#10141A);border:1px solid var(--line);
  border-radius:20px;box-shadow:var(--sh),inset 0 1px 0 rgba(255,255,255,.04);padding:24px 24px;position:relative;overflow:hidden}
.counter::after{content:'';position:absolute;width:360px;height:360px;border-radius:50%;
  background:radial-gradient(circle,rgba(240,180,41,.08),transparent 65%);left:-120px;top:-140px;pointer-events:none}
.cd-label{font-family:'Alexandria';font-weight:600;font-size:1.15rem;display:flex;align-items:center;gap:.55em;color:var(--ink)}
.cd-label .ic{color:var(--acc)}
.cd-sub{font-size:.82rem;color:var(--muted);margin-top:2px}
.cd-grid{display:flex;gap:12px;justify-content:center;flex-wrap:wrap;margin-top:18px}
.cd-cell{min-width:92px;text-align:center;background:rgba(255,255,255,.035);border:1px solid var(--line);
  border-radius:14px;padding:12px 6px 9px}
.cd-cell b{display:block;font-family:'Alexandria';font-size:2.4rem;line-height:1.2;font-weight:700;
  font-variant-numeric:tabular-nums;color:var(--acc);text-shadow:0 0 26px rgba(240,180,41,.35)}
.cd-cell span{font-size:.76rem;color:var(--muted)}
.cd-cell.sec{border-color:rgba(240,180,41,.45);background:var(--acc-soft)}
.cd-done{text-align:center;font-family:'Alexandria';font-size:1.3rem;padding:10px 0 2px}
.cd-done small{display:block;font-family:'Readex Pro';font-size:.88rem;color:var(--muted);margin-top:6px;font-weight:300}
.cd-prog{margin-top:18px}
.cd-track{height:9px;background:rgba(255,255,255,.05);border-radius:99px;overflow:hidden}
.cd-fill{background:linear-gradient(90deg,var(--acc),#F7C95B);height:100%;border-radius:99px;
  box-shadow:0 0 14px rgba(240,180,41,.5);transition:width 1s linear}
.cd-ptext{font-size:.8rem;color:var(--muted);margin-top:7px;text-align:center}
@media (max-width:560px){.cd-cell{min-width:66px}.cd-cell b{font-size:1.7rem}}

/* التبويبات */
.tabs{position:sticky;top:59px;z-index:40;display:flex;gap:6px;margin-top:22px;overflow-x:auto;
  background:rgba(11,13,16,.9);backdrop-filter:blur(12px);padding:10px 2px;border-radius:14px;
  border:1px solid var(--line2)}
.tab{display:flex;gap:.5em;align-items:center;padding:.5em 1.1em;border:1.5px solid transparent;
  border-radius:11px;font-weight:600;color:var(--muted);white-space:nowrap;transition:.16s}
.tab:hover{color:var(--ink2)}
.tab.on{background:var(--card2);border-color:var(--line);color:var(--acc);box-shadow:0 3px 12px rgba(0,0,0,.3)}
.tab .ic{width:1.05em;height:1.05em}

/* أقسام الأماكن */
.cat{background:var(--card);border:1px solid var(--line);border-radius:18px;box-shadow:var(--sh);
  margin-top:18px;overflow:hidden}
.cat-h{display:flex;align-items:center;gap:12px;padding:13px 18px;cursor:pointer;user-select:none}
.cat-ic{width:42px;height:42px;border-radius:12px;background:var(--teal-soft);color:var(--teal);
  border:1px solid rgba(62,207,178,.3);display:flex;align-items:center;justify-content:center;flex:none}
.cat-ic .ic{width:21px;height:21px}
.cat-h h3{font-size:1.15rem;font-weight:600}
.cat-n{background:var(--acc-soft);color:var(--acc);font-weight:700;font-size:.76rem;
  padding:.05em .65em;border-radius:99px;border:1px solid rgba(240,180,41,.3)}
.cat-h .chev{margin-inline-start:4px;transition:transform .25s;color:var(--muted)}
.cat.closed .chev{transform:rotate(-90deg)}
.cat.closed .cat-b{display:none}
.cat-b{padding-bottom:10px}
.empty-s{padding:4px 20px 12px;color:var(--muted);font-size:.88rem;font-weight:300}
.item{display:flex;gap:12px;padding:14px 20px;border-top:1px dashed var(--line)}
.it-main{flex:1;min-width:0}
.it-t{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.it-t>b{font-size:1.05rem;font-weight:600}
.stars{display:inline-flex;gap:1px}
.st{width:14px;height:14px;stroke:var(--line);fill:none}
.st.on{fill:var(--acc);stroke:var(--acc)}
.it-subs{display:flex;flex-wrap:wrap;gap:3px 18px;color:var(--ink2);font-size:.86rem;margin-top:3px}
.it-subs span,.it-subs a{display:inline-flex;align-items:center;gap:.4em;text-decoration:none;color:var(--ink2)}
.it-subs .ic{color:var(--muted);width:1em;height:1em}
.it-subs a:hover{color:var(--teal)}
.it-notes{margin-top:6px;font-size:.9rem;color:var(--muted);white-space:pre-wrap;font-weight:300}
.thumbs{display:flex;gap:8px;margin-top:10px;flex-wrap:wrap}
.thumb{width:64px;height:64px;border-radius:11px;overflow:hidden;border:1.5px solid var(--line);
  padding:0;transition:transform .15s,border-color .15s}
.thumb:hover{transform:translateY(-2px);border-color:var(--acc)}
.thumb img{width:100%;height:100%;object-fit:cover;display:block}
.it-act{display:flex;flex-direction:column;gap:8px;align-items:center}
@media (max-width:600px){.item{flex-direction:column-reverse}.it-act{flex-direction:row;justify-content:flex-start}}

/* المستلزمات */
.add-in{display:flex;gap:10px;align-items:center;margin:18px 0 4px;flex-wrap:wrap}
.add-in input{flex:1;min-width:180px}
.progress{height:9px;background:rgba(255,255,255,.05);border-radius:99px;overflow:hidden;margin:14px 0 4px}
.progress i{display:block;height:100%;background:linear-gradient(90deg,var(--teal),#6FE3CC);border-radius:99px;
  box-shadow:0 0 12px rgba(62,207,178,.4);transition:width .4s}
.ptext{font-size:.82rem;color:var(--muted)}
.p-item{display:flex;align-items:center;gap:12px;padding:10px 14px;border:1px solid var(--line);
  border-radius:13px;background:var(--card2);margin-top:9px}
.p-item .txt{flex:1;min-width:0}
.p-item.done{opacity:.55}
.p-item.done .txt{text-decoration:line-through;color:var(--muted)}
.ckbox{width:24px;height:24px;border:1.7px solid var(--line);border-radius:8px;display:flex;align-items:center;
  justify-content:center;background:var(--card);flex:none;color:transparent;transition:.16s}
.ckbox:hover{border-color:var(--teal)}
.ckbox.on{background:var(--teal);border-color:var(--teal);color:#06231D;box-shadow:0 0 12px rgba(62,207,178,.35)}
.allpacked{font-family:'Alexandria';color:var(--teal);font-weight:600;margin-top:14px;
  display:flex;align-items:center;gap:.5em}

/* التطبيقات */
.app-row{display:flex;align-items:center;gap:12px;padding:12px 16px;border:1px solid var(--line);
  border-radius:13px;background:var(--card2);margin-top:9px}
.app-ic{width:38px;height:38px;border-radius:11px;background:var(--teal-soft);color:var(--teal);
  border:1px solid rgba(62,207,178,.3);display:flex;align-items:center;justify-content:center;flex:none}
.app-row b{font-size:.98rem;font-weight:600}
.app-row p{font-size:.84rem;color:var(--muted);font-weight:300}
.sugg{display:flex;flex-wrap:wrap;gap:8px;margin-top:16px}
.sugg .chip{cursor:pointer;transition:.16s;color:var(--ink2)}
.sugg .chip:hover{border-color:var(--teal);color:var(--teal);background:var(--teal-soft)}

/* الألبوم */
.gal-top{display:flex;align-items:center;gap:12px;margin-top:18px;flex-wrap:wrap}
.masonry{columns:3 230px;column-gap:14px;margin-top:16px;padding-bottom:70px}
.g-item{position:relative;break-inside:avoid;margin-bottom:14px;border:1px solid var(--line);
  border-radius:15px;overflow:hidden;background:var(--card);box-shadow:var(--sh)}
.g-item img{width:100%;display:block}
.g-cap{padding:7px 12px;font-size:.84rem;color:var(--muted);border-top:1px dashed var(--line)}
.g-act{position:absolute;top:8px;inset-inline-start:8px;display:flex;gap:6px;opacity:0;transition:.2s}
.g-item:hover .g-act{opacity:1}
.g-act .iconbtn{width:30px;height:30px;background:rgba(11,13,16,.85);backdrop-filter:blur(6px)}

/* النوافذ */
.modal{position:fixed;inset:0;background:rgba(5,7,9,.7);backdrop-filter:blur(4px);z-index:100;
  display:flex;align-items:flex-start;justify-content:center;padding:4vh 16px;overflow:auto}
.m-card{background:var(--card);border:1px solid var(--line);border-radius:20px;
  box-shadow:0 24px 70px rgba(0,0,0,.6);width:100%;max-width:640px;padding:20px 24px 24px;animation:pop .25s}
.m-lg{max-width:780px}.m-sm{max-width:440px}
@keyframes pop{from{transform:translateY(16px);opacity:0}}
.m-head{display:flex;align-items:center;justify-content:space-between;margin-bottom:8px}
.m-head h3{font-size:1.2rem}
.m-actions{display:flex;gap:10px;margin-top:20px;flex-wrap:wrap}
.field{display:block;margin-top:13px}
.field>span{display:block;font-size:.83rem;font-weight:600;color:var(--ink2);margin-bottom:5px}
.f-lbl{display:block;font-size:.83rem;font-weight:600;color:var(--ink2);margin-top:13px}
input,textarea{width:100%;padding:.55em .9em;border:1.5px solid var(--line);border-radius:11px;
  background:#0E1218;color:var(--ink);transition:border .16s,box-shadow .16s;font-weight:400}
input::placeholder,textarea::placeholder{color:#5A636E}
input:focus,textarea:focus{outline:none;border-color:var(--teal);box-shadow:0 0 0 3px rgba(62,207,178,.15)}
textarea{resize:vertical}
input[type=range]{padding:0;border:none;background:none;box-shadow:none;accent-color:var(--acc);flex:1;min-width:0}
input[type=range]:focus{box-shadow:none}
input[type=datetime-local]{direction:ltr;color-scheme:dark}
.f2{display:grid;grid-template-columns:1fr 1fr;gap:0 14px}
@media (max-width:560px){.f2{grid-template-columns:1fr}}
.tr-row{display:flex;gap:8px;margin-top:8px;align-items:center}
.tr-row input{flex:1;min-width:0}
.add-in input{background:#0E1218}
.ph-grid{display:flex;flex-wrap:wrap;gap:10px;margin-top:10px}
.ph-thumb{position:relative;width:76px;height:76px;border-radius:11px;overflow:hidden;border:1.5px solid var(--line)}
.ph-thumb img{width:100%;height:100%;object-fit:cover;display:block}
.ph-tb{position:absolute;bottom:0;inset-inline:0;display:flex;justify-content:center;gap:4px;
  background:rgba(5,7,9,.65);padding:2px 0;opacity:0;transition:.15s}
.ph-thumb:hover .ph-tb{opacity:1}
.ph-tb button{color:#fff;display:flex;padding:2px}
.ph-tb .ic{width:14px;height:14px}
.cat-note{font-size:.82rem;color:var(--muted);margin-top:4px}
.cat-note b{color:var(--teal)}
.rt{padding:2px;color:var(--muted);transition:.15s}
.rt:hover{transform:scale(1.15)}
.rt.on{color:var(--acc)}

/* محرر الصور */
.pe-img-wrap{background:#080A0C;border:1px solid var(--line2);border-radius:14px;display:flex;align-items:center;justify-content:center;
  min-height:200px;max-height:400px;overflow:hidden;margin:12px 0}
.pe-img{max-width:100%;max-height:400px;object-fit:contain;display:block}
.pe-presets{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:14px}
.chip-btn{padding:.22em .9em;border:1.4px solid var(--line);border-radius:99px;background:var(--card2);
  font-size:.82rem;font-weight:600;transition:.16s;color:var(--ink2)}
.chip-btn:hover{border-color:var(--acc);color:var(--acc)}
.pe-ctrls{display:grid;grid-template-columns:1fr 1fr;gap:8px 22px}
@media (max-width:600px){.pe-ctrls{grid-template-columns:1fr}}
.sl{display:flex;align-items:center;gap:10px;font-size:.85rem}
.sl span{width:58px;font-weight:600;color:var(--ink2);flex:none}
.sl b{width:48px;text-align:center;font-size:.78rem;color:var(--muted);font-variant-numeric:tabular-nums;flex:none}
.pe-row{display:flex;gap:10px;margin-top:14px;flex-wrap:wrap}

/* توست */
#toasts{position:fixed;bottom:22px;right:50%;transform:translateX(50%);z-index:300;
  display:flex;flex-direction:column;gap:10px;align-items:center;pointer-events:none}
.toast{background:var(--card3);border:1px solid var(--line);color:var(--ink);padding:.55em 1.25em;border-radius:13px;
  box-shadow:0 12px 32px rgba(0,0,0,.5);display:flex;gap:.6em;align-items:center;
  font-size:.9rem;animation:tin .25s;max-width:88vw}
.toast.err{border-color:rgba(255,122,89,.5);color:var(--danger)}
.toast.ok .ic{color:var(--teal)}
@keyframes tin{from{transform:translateY(12px);opacity:0}}

/* عارض الصور */
#lightbox{position:fixed;inset:0;background:rgba(5,7,9,.93);z-index:200;display:flex;
  align-items:center;justify-content:center;flex-direction:column;gap:10px;padding:34px 60px}
#lightbox img{max-width:min(90vw,900px);max-height:72vh;border-radius:14px;
  border:1px solid rgba(240,180,41,.25);box-shadow:0 20px 70px rgba(0,0,0,.6)}
#lb-cap{color:var(--ink2);font-size:.95rem;text-align:center}
#lb-count{color:var(--muted);font-size:.8rem;font-variant-numeric:tabular-nums}
.lb-btn{position:absolute;top:50%;transform:translateY(-50%);width:44px;height:44px;border-radius:50%;
  border:1.5px solid var(--line);color:var(--ink2);display:flex;align-items:center;justify-content:center;transition:.15s;background:rgba(20,24,30,.6)}
.lb-btn:hover{background:var(--card2);color:var(--ink)}
.lb-prev{left:14px}.lb-prev .ic{transform:rotate(90deg)}
.lb-next{right:14px}.lb-next .ic{transform:rotate(-90deg)}
.lb-x{position:absolute;top:16px;inset-inline-start:16px;width:40px;height:40px;border-radius:50%;
  border:1.5px solid var(--line);color:var(--ink2);display:flex;align-items:center;justify-content:center;background:rgba(20,24,30,.6)}

/* الطباعة */
#printSheet{display:none}
@media print{
  body>*{display:none!important}
  body{background:#fff}
  #printSheet{display:block!important;padding:10mm;color:#1a1a1a;font-family:'Readex Pro',sans-serif}
  #printSheet h1{font-family:'Alexandria';font-size:26px;border-bottom:3px double #444;padding-bottom:6px;margin-bottom:8px}
  #printSheet .pm{color:#555;font-size:13px;margin-bottom:4px}
  #printSheet h2{font-family:'Alexandria';font-size:16px;color:#1E5A40;margin:14px 0 4px;
    border-bottom:1.5px solid #ccc;padding-bottom:2px}
  #printSheet li{margin:2px 0;font-size:13px}
}

<script>
/* ================= أدوات عامة ================= */
const LS='wihda.v1';
const uid=()=>Date.now().toString(36)+Math.random().toString(36).slice(2,7);
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const ic=(n,c='')=>`<svg class="ic ${c}" aria-hidden="true"><use href="#i-${n}"/></svg>`;
const AR='٠١٢٣٤٥٦٧٨٩';
const arD=n=>String(n).replace(/\d/g,d=>AR[d]);
const arPad=n=>arD(String(n).padStart(2,'0'));
const DT=new Intl.DateTimeFormat('ar-EG',{weekday:'long',day:'numeric',month:'long',year:'numeric'});
const TM=new Intl.DateTimeFormat('ar-EG',{hour:'numeric',minute:'2-digit'});
const fmtDT=iso=>iso?`${DT.format(new Date(iso))} · ${TM.format(new Date(iso))}`:'';
const fmtDate=iso=>iso?DT.format(new Date(iso)):'';
const dayWord=n=>n===1?'يوم':n===2?'يومان':n<=10?'أيام':'يوم';

function toast(msg,type='ok'){
  const el=document.createElement('div');
  el.className='toast '+type;
  el.innerHTML=(type==='ok'?ic('check'):ic('x'))+esc(msg);
  document.getElementById('toasts').appendChild(el);
  setTimeout(()=>{el.style.opacity='0';el.style.transition='opacity .4s';setTimeout(()=>el.remove(),400)},2600);
}
let savedT=null;
function flashSaved(){
  const f=document.getElementById('savedFlag'); f.classList.add('on');
  clearTimeout(savedT); savedT=setTimeout(()=>f.classList.remove('on'),1400);
}

/* ================= التخزين ================= */
let trips=[];
try{trips=JSON.parse(localStorage.getItem(LS))||[]}catch(e){trips=[]}
function persist(){
  flashSaved();
  try{localStorage.setItem(LS,JSON.stringify(trips))}
  catch(e){toast('مساحة التخزين ممتلئة — صدّر نسخة احتياطية واحذف بعض الصور','err')}
}
const defaultCats=()=>[
  {name:'الإقامة',icon:'bed'},{name:'المطاعم',icon:'utensils'},{name:'المقاهي',icon:'coffee'},
  {name:'المولات',icon:'bag'},{name:'الأسواق',icon:'basket'},{name:'الشوارع',icon:'sign'},
  {name:'الفعاليات',icon:'sparkles'},{name:'التمشيات',icon:'route'}
];

/* ================= الحالة والتنقل ================= */
const ui={view:'home',tripId:null,tab:'places',collapsed:new Set()};
const curTrip=()=>trips.find(t=>t.id===ui.tripId);
function tripStatus(t){
  const now=Date.now(),d=new Date(t.depart||0),r=new Date(t.ret||0);
  if(t.depart&&now<d)return'upcoming';
  if(t.depart&&t.ret&&now<=r)return'ongoing';
  if(t.ret&&now>r)return'done';
  return'upcoming';
}
function goHome(){ui.view='home';ui.tripId=null;render();}
function openTrip(id){ui.view='trip';ui.tripId=id;ui.tab='places';render();window.scrollTo({top:0});}
function render(){ui.view==='home'?renderHome():renderTripView();}

/* ================= الرئيسية ================= */
function relShort(ms){
  const s=Math.max(0,Math.floor(ms/1000));
  const d=Math.floor(s/86400),h=Math.floor(s%86400/3600),m=Math.floor(s%3600/60),sec=s%60;
  if(d>0)return `${arD(d)} ${dayWord(d)} ${arPad(h)} س`;
  if(h>0)return `${arD(h)} س ${arPad(m)} د`;
  return `${arPad(m)} د ${arPad(sec)} ث`;
}
function miniHTML(t){
  const st=tripStatus(t),now=Date.now();
  if(st==='upcoming')return `<span class="mini">تنطلق بعد <b>${relShort(new Date(t.depart)-now)}</b></span>`;
  if(st==='ongoing')return `<span class="mini live">جارية الآن · العودة بعد <b>${relShort(new Date(t.ret)-now)}</b></span>`;
  return `<span class="mini">انتهت الرحلة</span>`;
}
function badgeHTML(t){
  const st=tripStatus(t);
  if(st==='upcoming')return `<span class="badge up">${ic('clock')} قادمة</span>`;
  if(st==='ongoing')return `<span class="badge run"><i></i> جارية الآن</span>`;
  return `<span class="badge done">${ic('check')} انتهت</span>`;
}
function compassSVG(){
  let ticks='';
  for(let i=0;i<24;i++){
    const a=i*15*Math.PI/180,main=i%6===0,r1=main?70:78,r2=86;
    ticks+=`<line x1="${(100+r1*Math.sin(a)).toFixed(1)}" y1="${(100-r1*Math.cos(a)).toFixed(1)}" x2="${(100+r2*Math.sin(a)).toFixed(1)}" y2="${(100-r2*Math.cos(a)).toFixed(1)}" stroke-width="${main?2.4:1.1}"/>`;
  }
  return `<svg viewBox="0 0 200 200" class="compass">
    <path d="M28 168 C 58 128, 44 84, 92 42" stroke="currentColor" fill="none" stroke-width="2.2"
      stroke-linecap="round" stroke-dasharray="1 8" opacity=".5"/>
    <g transform="translate(84,26) scale(1.05)"><use href="#i-plane" width="26" height="26" style="color:var(--acc)"/></g>
    <circle cx="100" cy="100" r="95" fill="none" stroke="currentColor" stroke-width="1.6"/>
    <circle cx="100" cy="100" r="86" fill="none" stroke="currentColor" stroke-width="1.1" opacity=".5"/>
    <g stroke="currentColor" opacity=".75">${ticks}</g>
    <polygon points="100,38 108,100 100,112 92,100" fill="var(--acc)"/>
    <polygon points="100,162 108,100 100,88 92,100" fill="none" stroke="currentColor" stroke-width="1.6"/>
    <circle cx="100" cy="100" r="5" fill="var(--bg)" stroke="currentColor" stroke-width="1.6"/>
    <text x="100" y="26" text-anchor="middle" font-size="13">ش</text>
    <text x="180" y="105" text-anchor="middle" font-size="13">ق</text>
    <text x="100" y="192" text-anchor="middle" font-size="13">ج</text>
    <text x="21" y="105" text-anchor="middle" font-size="13">غ</text>
  </svg>`;
}
function renderHome(){
  const score={ongoing:0,upcoming:1,done:2};
  const list=[...trips].sort((a,b)=>{
    const sa=score[tripStatus(a)],sb=score[tripStatus(b)];
    if(sa!==sb)return sa-sb;
    if(sa===1)return new Date(a.depart)-new Date(b.depart);
    if(sa===2)return new Date(b.ret)-new Date(a.ret);
    return 0;
  });
  const up=trips.filter(t=>tripStatus(t)==='upcoming').length;
  let h=`<section class="hero">
    <div>
      <p class="kicker">دفتر سفرياتك الخاص — تعبّئه بنفسك</p>
      <h1>وِجهة<i>.</i></h1>
      <div class="rule"></div>
      <p class="hero-sub">سجّل كل رحلة كتذكرة: التواريخ والترانزيت، الإقامة والمطاعم والمقاهي والمولات والفعاليات، صورك، مستلزمات حقيبتك، وتطبيقاتك المفيدة — مع عدّاد حيّ يعدّ معك حتى الإقلاع.</p>
      <div class="hero-actions">

/* ================= العدّاد الحي ================= */
function counterHTML(t,mode){
  if(mode==='done'){
    return `<div class="cd-done">أُتمّت رحلتك إلى ${esc(t.name)}<small id="cdAgo"></small></div>`;
  }
  const label=mode==='up'
    ?`تنطلق رحلتك${t.to?' إلى '+esc(t.to):''} بعد`
    :`رحلتك جارية — متبقٍ للعودة بعد`;
  return `<div class="cd-label">${mode==='up'?ic('plane'):ic('clock')} ${label}</div>
    <div class="cd-sub">${mode==='up'?fmtDT(t.depart):fmtDT(t.ret)}</div>
    <div class="cd-grid">
      <div class="cd-cell"><b id="cdD">٠٠</b><span>يوم</span></div>
      <div class="cd-cell"><b id="cdH">٠٠</b><span>ساعة</span></div>
      <div class="cd-cell"><b id="cdM">٠٠</b><span>دقيقة</span></div>
      <div class="cd-cell sec"><b id="cdS">٠٠</b><span>ثانية</span></div>
    </div>
    ${mode==='run'?`<div class="cd-prog"><div class="cd-track"><div class="cd-fill" id="cdFill" style="width:0%"></div></div><div class="cd-ptext" id="cdPText"></div></div>`:''}`;
}
function tick(){
  document.querySelectorAll('[data-cdt]').forEach(el=>{
    const t=trips.find(x=>x.id===el.dataset.tid);
    if(t)el.innerHTML=miniHTML(t);
  });
  if(ui.view!=='trip')return;
  const t=curTrip(),box=document.getElementById('counterBox');
  if(!t||!box)return;
  const now=Date.now(),st=tripStatus(t);
  const mode=st==='done'?'done':st==='ongoing'?'run':'up';
  if(box.dataset.mode!==mode){box.dataset.mode=mode;box.innerHTML=counterHTML(t,mode);}
  if(mode==='done'){
    const ago=document.getElementById('cdAgo');
    if(ago){const s=(now-new Date(t.ret))/1000;
      ago.textContent=s<3600?`قبل ${arD(Math.max(1,Math.floor(s/60)))} دقيقة`
        :s<86400?`قبل ${arD(Math.floor(s/3600))} ساعة`
        :`قبل ${arD(Math.floor(s/86400))} ${dayWord(Math.floor(s/86400))} — ودفترك بانتظار الرحلة القادمة`;}
    return;
  }
  const target=new Date(mode==='up'?t.depart:t.ret)-now;
  const s=Math.max(0,Math.floor(target/1000));
  const d=Math.floor(s/86400),h=Math.floor(s%86400/3600),m=Math.floor(s%3600/60),sec=s%60;
  const set=(id,v)=>{const el=document.getElementById(id);if(el&&el.textContent!==v)el.textContent=v;};
  set('cdD',d>=100?arD(d):arPad(d));set('cdH',arPad(h));set('cdM',arPad(m));set('cdS',arPad(sec));
  if(mode==='run'){
    const total=new Date(t.ret)-new Date(t.depart);
    const pct=Math.min(100,Math.max(0,(now-new Date(t.depart))/total*100));
    const fill=document.getElementById('cdFill');if(fill)fill.style.width=pct.toFixed(2)+'%';
    const T=Math.max(1,Math.ceil(total/86400000));
    const day=Math.min(T,Math.floor((now-new Date(t.depart))/86400000)+1);
    const pt=document.getElementById('cdPText');
    if(pt)pt.textContent=`اليوم ${arD(day)} من ${arD(T)} — قطعت ${arD(Math.round(pct))}٪ من مدة رحلتك`;
  }
}

/* ================= الصور ================= */
function fileToPhoto(file){
  return new Promise(res=>{
    const r=new FileReader();
    r.onload=()=>{const img=new Image();
      img.onload=()=>{
        const M=1000;let w=img.width,h=img.height;
        if(Math.max(w,h)>M){const k=M/Math.max(w,h);w=Math.round(w*k);h=Math.round(h*k);}
        const c=document.createElement('canvas');c.width=w;c.height=h;
        c.getContext('2d').drawImage(img,0,0,w,h);
        res({id:uid(),src:c.toDataURL('image/jpeg',.8),fx:{b:100,c:100,s:100,sep:0,gray:0,hue:0},cap:''});
      };img.src=r.result;};
    r.readAsDataURL(file);
  });
}
function rotatePhoto(p,cb){
  const img=new Image();
  img.onload=()=>{
    const c=document.createElement('canvas');c.width=img.height;c.height=img.width;
    const x=c.getContext('2d');x.translate(c.width/2,c.height/2);x.rotate(Math.PI/2);
    x.drawImage(img,-img.width/2,-img.height/2);
    p.src=c.toDataURL('image/jpeg',.85);cb&&cb();
  };img.src=p.src;
}
function fxFilter(f){
  let o=[];
  if(f.b!=null&&f.b!==100)o.push(`brightness(${f.b}%)`);
  if(f.c!=null&&f.c!==100)o.push(`contrast(${f.c}%)`);
  if(f.s!=null&&f.s!==100)o.push(`saturate(${f.s}%)`);
  if(f.sep)o.push(`sepia(${f.sep/100})`);
  if(f.gray)o.push(`grayscale(${f.gray/100})`);
  if(f.hue)o.push(`hue-rotate(${f.hue}deg)`);
  return o.join(' ')||'none';
}
const fxStyle=p=>fxFilter(p.fx||{});
const PRESETS={
  original:{label:'أصلية',fx:{b:100,c:100,s:100,sep:0,gray:0,hue:0}},
  warm:{label:'دافئة',fx:{b:104,c:102,s:116,sep:16,gray:0,hue:0}},
  cool:{label:'باردة',fx:{b:103,c:104,s:108,sep:0,gray:0,hue:-14}},
  cinema:{label:'سينمائية',fx:{b:98,c:114,s:84,sep:10,gray:0,hue:0}},
  bw:{label:'أبيض وأسود',fx:{b:102,c:106,s:100,sep:0,gray:100,hue:0}},
  vivid:{label:'حيوية',fx:{b:102,c:108,s:150,sep:0,gray:0,hue:0}}
};
let pe=null;
const peMap={B:'b',C:'c',S:'s',Sep:'sep',Gray:'gray',Hue:'hue'};
function peSliders(){const o={};for(const k in peMap)o[peMap[k]]=+document.getElementById('pe'+k).value;return o;}
function peApply(){
  if(!pe)return;
  const f=peSliders();
  document.getElementById('peImg').style.filter=fxFilter(f);
  for(const k in peMap){
    const el=document.getElementById('pe'+k+'v');if(!el)continue;
    el.textContent=k==='Hue'?f[peMap[k]]+'°':f[peMap[k]]+'%';
  }
}
function pePreset(k){
  const fx=PRESETS[k].fx;
  for(const key in peMap)document.getElementById('pe'+key).value=fx[peMap[key]];
  peApply();
}
function peRotate(){rotatePhoto(pe.photo,()=>{document.getElementById('peImg').src=pe.photo.src;});}

/* ================= نسخ احتياطي / مشاركة / طباعة ================= */
function exportBackup(){
  if(!trips.length){toast('لا توجد رحلات بعد','err');return;}
  const blob=new Blob([JSON.stringify(trips,null,2)],{type:'application/json'});
  const a=document.createElement('a');
  a.href=URL.createObjectURL(blob);
  a.download=`wihda-backup-${new Date().toISOString().slice(0,10)}.json`;
  a.click();URL.revokeObjectURL(a.href);
  toast('نُزّلت النسخة الاحتياطية — احتفظ بها');
}
function importBackup(inp){
  const f=inp.files[0];inp.value='';if(!f)return;
  const r=new FileReader();
  r.onload=()=>{
    try{
      const arr=JSON.parse(r.result);
      if(!Array.isArray(arr))throw 0;
      let added=0,upd=0;
      arr.forEach(x=>{
        if(!x||!x.id||!x.name)return;
        const i=trips.findIndex(t=>t.id===x.id);
        if(i>-1){trips[i]=x;upd++;}else{trips.push(x);added++;}
      });
      persist();render();
      toast(`استُوردت الرحلات: ${added} جديدة، ${upd} مُحدّثة`);
    }catch(e){toast('الملف غير صالح','err');}
  };r.readAsText(f);
}
function copySummary(){
  const t=curTrip();if(!t)return;
  const L=[];
  L.push(`رحلة: ${t.name}`);
  if(t.from||t.to)L.push(`من ${t.from||'—'} إلى ${t.to||'—'}`);
  if(t.depart)L.push(`الذهاب: ${fmtDT(t.depart)}`);
  if(t.ret)L.push(`العودة: ${fmtDT(t.ret)}`);
  if(t.transit?.length)L.push('الترانزيت: '+t.transit.map(x=>`${x.name}${x.wait?' ('+x.wait+')':''}`).join('، '));
  if(t.airline)L.push(`الخطوط: ${t.airline}${t.flightOut?' — ذهاب '+t.flightOut:''}${t.flightIn?' — عودة '+t.flightIn:''}`);
  if(t.notes)L.push(`ملاحظات: ${t.notes}`);
  t.categories.forEach(c=>{
    if(!c.items.length)return;
    L.push('',c.name+':');
    c.items.forEach(i=>L.push(`- ${i.title}${i.address?' — '+i.address:''}${i.when?' ('+i.when+')':''}${i.notes?' — '+i.notes:''}`));
  });
  if(t.packing.length){
    L.push('',`المستلزمات (${t.packing.filter(p=>p.done).length}/${t.packing.length}):`);
    t.packing.forEach(p=>L.push(`- ${p.text}${p.done?' (تم)':''}`));
  }
  if(t.apps.length){
    L.push('','تطبيقات مفيدة:');
    t.apps.forEach(a=>L.push(`- ${a.name}${a.desc?' — '+a.desc:''}`));
  }
  navigator.clipboard.writeText(L.join('\n'))
    .then(()=>toast('نُسخ ملخص الرحلة — أرسله لمن تحب'))
    .catch(()=>toast('تعذّر النسخ','err'));
}
function printTrip(){
  const t=ui.view==='trip'?curTrip():null;
  if(!t){toast('افتح رحلة أولًا ثم اطبع بطاقتها','err');return;}
  let h=`<h1>${esc(t.name)}</h1><p class="pm">${esc(t.from||'')} ← ${esc(t.to||'')}${t.depart&&t.ret?` · ${fmtDate(t.depart)} → ${fmtDate(t.ret)}`:''}</p>`;
  if(t.depart)h+=`<p class="pm">الذهاب: ${fmtDT(t.depart)}${t.ret?` — العودة: ${fmtDT(t.ret)}`:''}</p>`;
  if(t.transit?.length)h+=`<p class="pm">الترانزيت: ${esc(t.transit.map(x=>`${x.name}${x.wait?' ('+x.wait+')':''}`).join('، '))}</p>`;
  t.categories.forEach(c=>{
    if(!c.items.length)return;
    h+=`<h2>${esc(c.name)}</h2><ul>${c.items.map(i=>`<li><b>${esc(i.title)}</b>${i.address?' — '+esc(i.address):''}${i.when?' ('+esc(i.when)+')':''}${i.notes?'<br><small>'+esc(i.notes)+'</small>':''}</li>`).join('')}</ul>`;
  });
  if(t.packing.length)h+=`<h2>المستلزمات</h2><ul>${t.packing.map(p=>`<li>${p.done?'[تم]':'[ ]'} ${esc(p.text)}</li>`).join('')}</ul>`;
  if(t.apps.length)h+=`<h2>تطبيقات السفر</h2><ul>${t.apps.map(a=>`<li>${esc(a.name)}${a.desc?' — '+esc(a.desc):''}</li>`).join('')}</ul>`;
  document.getElementById('printSheet').innerHTML=h;
  setTimeout(()=>window.print(),80);
}

render();
</script>
</body>
</html>
